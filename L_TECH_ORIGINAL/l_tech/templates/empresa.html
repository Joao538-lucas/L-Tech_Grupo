<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questionário - Empresa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="questionario-body">

    <div class="questionario-card">
        <div class="mini-logo">L-TECH</div>

        <h1>Quantas pessoas trabalham em sua empresa?</h1>
        <p>Essa informação ajudará a personalizar sua experiência</p>

        <form action="/empresa" method="POST">

            <div class="opcoes-grid">
                <label><input type="radio" name="quantidade" value="Somente eu"> <span>Somente eu</span></label>
                <label><input type="radio" name="quantidade" value="Empresa Júnior"> <span>Empresa Júnior</span></label>
                <label><input type="radio" name="quantidade" value="2-10"> <span>2–10</span></label>
                <label><input type="radio" name="quantidade" value="11-50"> <span>11–50</span></label>
                <label><input type="radio" name="quantidade" value="51-200"> <span>51–200</span></label>
                <label><input type="radio" name="quantidade" value="201-500"> <span>201–500</span></label>
                <label><input type="radio" name="quantidade" value="501-1000"> <span>501–1.000</span></label>
                <label><input type="radio" name="quantidade" value="1001-5000"> <span>1.001–5.000</span></label>
                <label><input type="radio" name="quantidade" value="5001-10000"> <span>5.001–10.000</span></label>
                <label><input type="radio" name="quantidade" value="10001 ou mais"> <span>10.001 ou mais</span></label>
            </div>

            <div class="campo-empresa">
                <h2>Qual o nome da sua empresa?</h2>
                <input type="text" name="empresa" required>
            </div>

            <div class="rodape-questionario">
                <div class="passos">
                    <span class="ativo"></span>
                    <span></span>
                </div>

                <button type="submit">Continuar</button>
            </div>

        </form>
    </div>

</body>
</html>
