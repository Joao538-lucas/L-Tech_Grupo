<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
</head>
<body>

<h1>Editar Produto</h1>

<form method="POST">

    <label>Nome</label>
    <input type="text" name="nome" value="{{ produto.nome }}">

    <br><br>

    <label>Preço</label>
    <input type="text" name="preco" value="{{ produto.preco }}">

    <br><br>

    <label>Estoque</label>
    <input type="number" name="estoque" value="{{ produto.estoqueatual }}">

    <br><br>
    <label>Limite Máximo de Estoque</label>
    <input type="number" name="limite_maximo" min="1" value="{{ produto.limite_maximo }}" required>

    <br><br>

    <label>Validade</label>
    <input type="date" name="validade" value="{{ produto.datasaida }}">

    <br><br>

    <button type="submit">Salvar alterações</button>

</form>

</body>
</html>
