<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
</head>

<body>

<h1>Editar Cliente</h1>

<form method="POST">
    <input type="text" name="nome" value="{{ cliente.nome }}" placeholder="Nome"><br><br>
    <input type="email" name="email" value="{{ cliente.email }}" placeholder="Email"><br><br>
    <input type="password" name="senha" value="{{ cliente.senha }}" placeholder="Senha"><br><br>

    <button type="submit">Salvar</button>
</form>

</body>
</html>
