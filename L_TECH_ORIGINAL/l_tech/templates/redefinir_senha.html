<form action="/redefinir-senha" method="POST">

    <input
        type="password"
        name="senha"
        placeholder="Nova senha"
        required
    >

    <input
        type="password"
        name="confirmar_senha"
        placeholder="Confirmar nova senha"
        required
    >

    <button type="submit">
        Redefinir senha
    </button>

</form>
